---
- name: Hello World Playbook
  hosts: local
  gather_facts: yes
  
  tasks:
    - name: Print greeting
      debug:
        msg: "Привет от Ansible! Сервер {{ inventory_hostname }} работает на {{ ansible_distribution }} {{ ansible_distribution_version }}"
    
    - name: Check uptime
      command: uptime
      register: uptime_result
      changed_when: false
    
    - name: Display uptime
      debug:
        var: uptime_result.stdout

---
- name: Deploy secrets from Ansible Vault
  hosts: all
  become: yes

  vars_files:
    - ../vault/secrets.yml

  tasks:
    - name: Create app config with secret (masked in logs)
      copy:
        content: |
          # Managed by Ansible - do not edit
          DB_PASSWORD={{ db_password }}
          API_KEY={{ app_api_key }}
        dest: /etc/app-secrets.conf
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Confirm secret file exists
      stat:
        path: /etc/app-secrets.conf
      register: secret_file

    - name: Show result (without revealing values)
      debug:
        msg: "Secrets deployed: {{ secret_file.stat.exists }}, mode={{ secret_file.stat.mode }}"
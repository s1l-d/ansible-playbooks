---
- name: Install nginx
  apt:
    name: nginx
    state: present
  notify: Restart nginx
  tags:
    - install
    - packages

- name: Copy nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx
  tags:
    - config
    - nginx

- name: Ensure nginx is started and enabled
  service:
    name: nginx
    state: started
    enabled: yes
  tags:
    - service
    - nginx
